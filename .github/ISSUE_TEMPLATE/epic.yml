name: Epic
description: >
  A multi-feature effort that ships as one user-facing story. Children are
  linked as native GitHub sub-issues, not markdown checklists. See
  CONTRIBUTING.md for how epics are structured.
title: "[Epic]: "
labels: ["epic"]
body:
  - type: textarea
    id: user-facing-summary
    attributes:
      label: What changes for the user
      description: >
        One paragraph, written now, before any code exists. The user is
        usually a downstream server author (or the operators of every
        server in the family). This is the highest-value field: it records
        the intent the release is checked against, so write it for the
        person upgrading, not for the implementer.
      placeholder: "After this epic, a downstream server can ..."
    validations:
      required: true
  - type: dropdown
    id: surface-impact
    attributes:
      label: Surface impact
      description: >
        Which compatibility surfaces this epic touches. Decided once at epic
        creation and inherited by the children, rather than argued per
        commit; feeds the breaking-change policy in AGENTS.md.
      multiple: true
      options:
        - Public library API (__all__, jobs / transfer namespaces)
        - Environment-variable contract
        - Wire format (docs/specs/)
        - MCP tool surface pvl-core registers on downstreams
        - None (internal only)
    validations:
      required: true
  - type: dropdown
    id: ships-atomically
    attributes:
      label: Ships atomically
      description: >
        If yes, no release may be cut while this epic is mid-flight. This
        answer records the intent; the machine-readable signal is the
        `ships-atomically` label applied after filing (see the checklist
        below). Forms cannot apply it conditionally.
      options:
        - "Yes — no release may be cut mid-epic"
        - "No — children can ship independently"
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Planned children
      description: >
        The planned child issues, one per line ("#N" for issues that already
        exist, a one-line description for those that don't yet), including
        the cutover issues a shape change needs on the template and on
        downstreams. This list is planning prose only; the queryable
        relationship is the native sub-issue link, created after filing.
        Do not maintain a markdown task list as the source of truth.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this epic deliberately does not cover.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### After filing (issue forms cannot do these)

        Forms cannot create sub-issue links or apply labels conditionally,
        so finish the epic setup after submitting. The
        `authoring-issues-prs` skill
        (`.agents/skills/authoring-issues-prs/SKILL.md`) performs these
        steps mechanically.

        1. **Link the children as native sub-issues**: issue sidebar
           ("Create sub-issue" / "Add existing issue") or the sub-issues
           API. This makes the grouping queryable (`has_parent`,
           `sub_issues_summary`) instead of prose to pattern-match.
        2. **If the epic ships atomically**, apply the `ships-atomically`
           label to the epic and its children. Milestones here are themes,
           not releases, and do not carry this signal.
