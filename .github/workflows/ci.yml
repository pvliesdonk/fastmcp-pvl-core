name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/
      - name: Test
        if: matrix.python-version != '3.14'
        run: uv run pytest -x -q --durations=20
      - name: Test with coverage
        # Only this required interpreter supplies coverage to the sonar job;
        # branch instrumentation on the other entries would cost their budget
        # for a result nothing reads.
        if: matrix.python-version == '3.14'
        run: uv run pytest -x -q --cov=fastmcp_pvl_core --cov-report=xml --durations=20
      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  sonar:
    # Runs the SonarQube Cloud scan on the Python 3.14 coverage report. Fork
    # PRs get no SONAR_TOKEN, so they skip the job instead of failing it.
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for SCM blame and new-code detection.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
