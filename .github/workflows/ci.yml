name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        # `--frozen` installs exactly what uv.lock pins and never re-resolves.
        # Not `--locked`: the release commit PSR pushes runs CI with the lock's
        # own version entry one behind until release.yml's follow-up sync
        # commit, and `--locked` would fail it. The later steps run with
        # `--no-sync --no-build`, so nothing resolves or builds after this.
        run: uv sync --all-extras --frozen  # NOSONAR(githubactions:S8541,S8544): installs this project, which --no-build refuses; versions come from uv.lock via --frozen
      - name: Lint
        run: |
          uv run --no-sync --no-build ruff check .
          uv run --no-sync --no-build ruff format --check .
      - name: Type check
        run: uv run --no-sync --no-build mypy src/
      - name: Test
        if: matrix.python-version != '3.14'
        run: uv run --no-sync --no-build pytest -x -q --durations=20
      - name: Test with coverage
        # Only this required interpreter supplies coverage to the sonar job;
        # branch instrumentation on the other entries would cost their budget
        # for a result nothing reads.
        if: matrix.python-version == '3.14'
        run: uv run --no-sync --no-build pytest -x -q --cov=fastmcp_pvl_core --cov-report=xml --durations=20
      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  sonar:
    # Runs the SonarQube Cloud scan on the Python 3.14 coverage report. Fork
    # PRs get no SONAR_TOKEN, so they skip the job instead of failing it.
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Full history for SCM blame and new-code detection.
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: coverage-report
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-success:
    name: CI Success
    # Single aggregate gate that the protect-main ruleset requires and that
    # auto-merge waits for. Succeeds only if every upstream job succeeded or
    # was skipped (`sonar` skips on fork PRs); fails if any failed or was
    # cancelled. Requiring this ONE context is drift-proof: renaming or adding
    # a job here never silently disables the gate, as long as it is listed
    # under `needs`. The context string is this job's `name`, so renaming it
    # means changing .github/rulesets/protect-main.json in the same PR.
    needs:
      - test
      - sonar
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not pass (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed."
