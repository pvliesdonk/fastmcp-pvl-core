name: Claude Code Review

on:
  pull_request:
    # Match ci.yml's trigger. The review is gated on CI (wait-for-ci job), and
    # ci.yml only runs on PRs targeting main — firing the reviewer on
    # other-target PRs would just idle the poll to its timeout, then skip.
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  wait-for-ci:
    # Skip PRs from forks: GitHub does not expose repository secrets
    # (including CLAUDE_CODE_OAUTH_TOKEN) to workflows running in fork-PR
    # context, regardless of maintainer approval. Running anyway produces
    # a hard-failing check on every external contribution.
    # Skip Renovate dependency bumps too, as the template's reviewer does:
    # version-pin diffs need no model review, and CI already gates them.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      ci_passed: ${{ steps.wait.outputs.ci_passed }}
    steps:
      - name: Wait for CI to conclude on this PR head
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Gate the review on the CI workflow: only review code the gate
          # accepted. Poll the CI run for THIS PR head SHA (not github.sha,
          # which is the merge commit) until it completes; tolerate the
          # not-yet-created race by looping. Gate on the run *conclusion* so a
          # completed-but-failed run (any matrix job) skips the review.
          deadline=$(( SECONDS + 25 * 60 ))
          conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            # A genuine API failure (auth, rate-limit, network) must not look
            # like the "run not created yet" case (which returns 200 + an empty
            # list): log it so a spin-to-timeout is diagnosable, then fall back
            # to {} and keep polling.
            if ! runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&per_page=1" 2>/tmp/gh_err); then
              echo "CI poll: gh api failed (retrying): $(cat /tmp/gh_err)" >&2
              runs='{}'
            fi
            status=$(echo "$runs" | jq -r '.workflow_runs[0].status // empty')
            conclusion=$(echo "$runs" | jq -r '.workflow_runs[0].conclusion // empty')
            if [ "$status" = "completed" ]; then
              break
            fi
            echo "CI status: ${status:-not-found-yet}; waiting 20s..."
            sleep 20
          done
          if [ "$conclusion" = "success" ]; then
            echo "ci_passed=true" >> "$GITHUB_OUTPUT"
            echo "CI passed — review will run."
          else
            echo "ci_passed=false" >> "$GITHUB_OUTPUT"
            echo "CI did not pass (conclusion=${conclusion:-timeout}) — skipping review."
          fi

  claude-review:
    needs: wait-for-ci
    if: ${{ needs.wait-for-ci.outputs.ci_passed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Reviewer reads code; it must never commit
      pull-requests: write     # Post inline review comments
      issues: read
      id-token: write
      actions: read            # Read CI results instead of re-running them
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "latest"

      - name: Cache Python interpreter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.local/share/uv/python
          key: uv-python-3.12-${{ runner.os }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # Gives the reviewer a working venv so its targeted `uv run` checks
        # (pytest/mypy/ruff, granted below) actually execute. `--frozen`
        # installs what uv.lock pins without re-locking, so a stale lock does
        # not fail the job before the review starts.
        run: uv sync --all-extras --all-groups --frozen  # NOSONAR(githubactions:S8541,S8544): installs this project, which --no-build refuses; versions come from uv.lock via --frozen

      # The /code-review plugin fans out into parallel review agents. On Claude
      # Code >= 2.1.198 those dispatch as background tasks that claude-code-action
      # drops before they finish — runClaudeWithSdk breaks the query() loop on the
      # first result (claude-code-action#1499), so the review completes green and
      # posts nothing (also #1087 / #1523, claude-code#85275 — all silent). Pin
      # the last synchronous-subagent release (2.1.197, verified with action@v1 in
      # claude-code#73453) so the fan-out completes in-turn. Remove this step and
      # the path_to_claude_code_executable input once #1499 is fixed upstream.
      - name: Install pinned Claude Code (2.1.197, pre-background-subagents)
        # The binary is downloaded directly and checked against the checksum
        # the release manifest publishes for linux-x64, rather than piping
        # claude.ai/install.sh into bash: an unverified script would run with
        # this job's token (SonarCloud githubactions:S8482, S6506). To move the
        # pin, copy `platforms["linux-x64"].checksum` from
        # https://downloads.claude.ai/claude-code-releases/<version>/manifest.json.
        # `claude install <version>` is the step install.sh ends with; it fetches
        # the native build again and checks that copy against the same release
        # manifest itself, so no unverified code runs at either step.
        env:
          CLAUDE_CODE_VERSION: "2.1.197"
          CLAUDE_CODE_SHA256: f54e69cbc89b2da61a415700af7ff52a147e862517d4f1b0eecf768448cf7f83
        run: |
          set -euo pipefail
          DL="$RUNNER_TEMP/claude-$CLAUDE_CODE_VERSION"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$DL" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          echo "$CLAUDE_CODE_SHA256  $DL" | sha256sum -c -
          chmod +x "$DL"
          "$DL" install "$CLAUDE_CODE_VERSION"
          rm -f "$DL"
          BIN="$HOME/.local/bin/claude"
          test -x "$BIN"
          "$BIN" --version
          echo "CLAUDE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the pinned 2.1.197 CLI installed above (skips the action's own).
          path_to_claude_code_executable: ${{ env.CLAUDE_BIN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` tells the plugin to actually post (without it, the plugin
          # runs the full review and stops silently — burning ~$3/PR for no output).
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Surface progress so a silent failure is visible.
          track_progress: true
          display_report: true
          include_fix_links: false
          # Read CI results through the built-in GitHub CI MCP server.
          additional_permissions: |
            actions: read
          # Grant the built-in GitHub read/search MCP tools, the CI tools, the
          # inline-comment tool (what lets the reviewer post inline — not in the
          # default allow-set), `gh api` (read + write, bounded by the token
          # scopes), `gh pr comment` for posting a summary comment, the gh
          # pr/run read commands (pr diff/view, run view/list), scoped `uv run`
          # gate tools for targeted investigation, plus Skill (launch the
          # /code-review plugin) and Task (dispatch its review subagents —
          # synchronous under the pinned 2.1.197; issue #258). contents: read
          # above keeps the reviewer from committing — it only reads and comments.
          # Subagents inherit this same set — delegation, not new capability.
          claude_args: |
            --allowedTools "Skill,Task,mcp__github__get_*,mcp__github__list_*,mcp__github__search_*,mcp__github_ci__*,mcp__github_inline_comment__*,Bash(gh api *),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(gh run list:*),Bash(uv run pytest:*),Bash(uv run mypy:*),Bash(uv run ruff:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
