name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force version bump (empty = auto; "prerelease" advances the rc revision e.g. rc.1 → rc.2 — keep the pre-release box below checked)'
        type: choice
        default: ''
        options:
          - ''
          - prerelease
          - patch
          - minor
          - major
      prerelease:
        description: 'Cut a pre-release (rc channel — versions like 0.2.0-rc.1). Uncheck for a real release.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false

    # PSR is invoked directly (below) rather than through its Docker actions, so
    # these pins are ours to set. Keep both steps on the same pair.
    env:
      PSR_SPEC: "python-semantic-release==10.5.3"
      # GitPython 3.1.60 (2026-08-25) removed ``Actor.name_email_regex``, which
      # PSR's config loader calls unconditionally, so every PSR version up to
      # and including the current 10.6.1 aborts before doing anything. Upstream:
      # python-semantic-release#1475 / #1476. Drop this pin once PSR ships a
      # release that no longer uses the removed attribute.
      PSR_GITPYTHON_PIN: "gitpython<3.1.60"

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Reject contradictory dispatch inputs
        if: inputs.force == 'prerelease' && inputs.prerelease == false
        run: |
          echo "::error::force=prerelease advances the rc revision and requires the pre-release box to stay checked"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.6"

      - name: Setup Python
        run: uv python install 3.12

      # Runs PSR directly instead of python-semantic-release/python-semantic-release@vX.
      # That action is a Docker action whose image pip-installs PSR at run time
      # with no GitPython upper bound, so there is nowhere to pin the dependency
      # that broke it (see PSR_GITPYTHON_PIN above); a release that worked on
      # 2026-08-20 failed on 2026-08-25 with no change on our side. The flags
      # below reproduce the action's own input mapping, and PSR writes
      # ``released``/``version``/``tag`` (and the rest) to ``$GITHUB_OUTPUT``
      # itself, so ``steps.release.outputs.*`` is unchanged.
      - name: Semantic Version Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
          PRERELEASE: ${{ inputs.prerelease }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          # Inputs reach the shell as env vars, never interpolated into it.
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--as-prerelease)
          fi
          if [ -n "$FORCE" ]; then
            args+=("--$FORCE")
          fi

          uv tool run --from "$PSR_SPEC" --with "$PSR_GITPYTHON_PIN" \
            semantic-release -v version "${args[@]}" --prerelease-token rc

      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: uv build

      # publish-action@vX is the same Docker-action shape with the same
      # unpinned install, so it fails identically; run ``publish`` directly too.
      - name: Upload to GitHub Release Assets
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          uv tool run --from "$PSR_SPEC" --with "$PSR_GITPYTHON_PIN" \
            semantic-release -v publish --tag "$TAG"

      - name: Upload build artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Runs last, after the build/upload/publish path, and is non-blocking:
      # PSR bumps pyproject/__init__ and commits but never re-locks, so
      # uv.lock's own package entry lags one version behind after every
      # release. Re-lock here — uv is installed in this job, whereas PSR's own
      # container has no uv, which is why it cannot do this itself — and commit
      # the single changed line. ``[skip ci]`` keeps this follow-up commit from
      # re-triggering CI. ``continue-on-error`` ensures a git-push hiccup on
      # this dev-convenience sync (uv.lock is not shipped in the wheel) never
      # fails an already-tagged release nor blocks the dependent PyPI publish.
      - name: Sync uv.lock to the released version
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync with the released version."
          else
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock to released version [skip ci]"
            git push || echo "::warning::uv.lock push failed; run 'uv lock' and commit it manually."
          fi

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

  publish-pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastmcp-pvl-core

    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # v1.14.2+ required: hatchling is unpinned in [build-system], and current
        # hatchling emits core metadata 2.5, which the twine bundled in v1.14.x
        # before .2 rejects ("'2.5' is not a valid metadata version"). v1.14.2
        # upgraded to Twine v7, which accepts 2.5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
          verbose: true
