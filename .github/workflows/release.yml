name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force version bump (empty = auto; "prerelease" advances the rc revision e.g. rc.1 → rc.2 — keep the pre-release box below checked)'
        type: choice
        default: ''
        options:
          - ''
          - prerelease
          - patch
          - minor
          - major
      prerelease:
        description: 'Cut a pre-release (rc channel — versions like 0.2.0-rc.1). Uncheck for a real release.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Reject contradictory dispatch inputs
        if: inputs.force == 'prerelease' && inputs.prerelease == false
        run: |
          echo "::error::force=prerelease advances the rc revision and requires the pre-release box to stay checked"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.6"

      - name: Setup Python
        run: uv python install 3.12

      - name: Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          force: ${{ inputs.force }}
          prerelease: ${{ inputs.prerelease }}
          prerelease_token: rc

      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Upload to GitHub Release Assets
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Upload build artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Runs last, after the build/upload/publish path, and is non-blocking:
      # PSR bumps pyproject/__init__ and commits but never re-locks, so
      # uv.lock's own package entry lags one version behind after every
      # release. Re-lock here — uv is installed in this job, whereas PSR's own
      # container has no uv, which is why it cannot do this itself — and commit
      # the single changed line. ``[skip ci]`` keeps this follow-up commit from
      # re-triggering CI. ``continue-on-error`` ensures a git-push hiccup on
      # this dev-convenience sync (uv.lock is not shipped in the wheel) never
      # fails an already-tagged release nor blocks the dependent PyPI publish.
      - name: Sync uv.lock to the released version
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync with the released version."
          else
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock to released version [skip ci]"
            git push || echo "::warning::uv.lock push failed; run 'uv lock' and commit it manually."
          fi

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

  publish-pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastmcp-pvl-core

    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/
          print-hash: true
          verbose: true
