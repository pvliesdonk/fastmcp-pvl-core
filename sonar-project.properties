# SonarQube Cloud analysis, run from the `sonar` job in .github/workflows/ci.yml
# (Automatic Analysis must stay disabled in the project settings, or the CI
# scan is rejected). The scanner reads SONAR_TOKEN from the environment.
sonar.organization=pvliesdonk
sonar.projectKey=pvliesdonk_fastmcp-pvl-core
sonar.projectName=fastmcp-pvl-core

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13

# Combined across every CI matrix leg: src/ has sys.version_info branches that
# only one interpreter range executes.
sonar.python.coverage.reportPaths=coverage.xml
