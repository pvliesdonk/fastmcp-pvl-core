# SonarQube Cloud analysis, run from the `sonar` job in .github/workflows/ci.yml
# (Automatic Analysis must stay disabled in the project settings, or the CI
# scan is rejected). The scanner reads SONAR_TOKEN from the environment.
sonar.organization=pvliesdonk
sonar.projectKey=pvliesdonk_fastmcp-pvl-core
sonar.projectName=fastmcp-pvl-core

# `.github` is scanned so the githubactions rules (action pinning, uv
# install flags, download verification) run on the workflows. With `src`
# alone the rating reads A without looking at them.
sonar.sources=src,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13,3.14

# Collected on the Python 3.14 CI leg only. Branches taken only on older
# interpreters (sys.version_info guards) therefore report as uncovered.
sonar.python.coverage.reportPaths=coverage.xml
